[package]
name = "actix-supabase-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "An asynchronous Actix Web API backed by Supabase PostgreSQL"
license = "MIT"

[dependencies]
actix-web = "4"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"